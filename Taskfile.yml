# Byte TV 桌面客户端（Wails v3 v3.0.0-beta.28，Go 1.25）。安装 Task：https://taskfile.dev
# 所有任务都是 scripts/desktop/*.sh 的薄封装，不装 Task 也可以直接运行脚本。
version: "3"

vars:
  VERSION: '{{.VERSION | default "0.1.3"}}'

env:
  VERSION: "{{.VERSION}}"
  GOTOOLCHAIN: go1.25.0+auto

tasks:
  build:frontend:
    desc: 构建 React 前端并嵌入 cmd/bytetv/ui
    cmds:
      - bash -c 'source scripts/desktop/common.sh && build_frontend'

  dev:
    desc: 开发运行（使用 frontend/dist，开启开发者工具菜单）
    cmds: [bash scripts/desktop/dev.sh]

  build:
    desc: 为当前平台构建 bin/bytetv
    cmds: [bash scripts/desktop/build.sh]

  package:mac:
    desc: macOS universal Byte TV.app + .dmg（MAC_SIGN_IDENTITY / NOTARY_PROFILE 或 APPLE_ID+APPLE_TEAM_ID+APPLE_APP_PASSWORD）
    platforms: [darwin]
    cmds: [bash scripts/desktop/package-mac.sh]

  package:windows:
    desc: Windows amd64/arm64 exe + NSIS 安装包（内置 WebView2 bootstrapper，需要 makensis）
    cmds: [bash scripts/desktop/package-windows.sh]

  test:
    desc: Go 与前端检查
    cmds:
      - go vet ./internal/... ./cmd/...
      - go test ./internal/...
      - cd frontend && npm run build
